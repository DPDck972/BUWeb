<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Acerto do juiz semântico por arquitetura</title>
  <desc id="desc">Comparação entre LangGraph e CrewAI em um benchmark de 20 perguntas.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#172033">Acerto do juiz semântico — 20 perguntas</text>
  <line x1="90" y1="430" x2="830" y2="430" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="430" x2="90" y2="80" stroke="#475569" stroke-width="2"/>
  <g font-family="Segoe UI, Arial" font-size="14" fill="#64748b">
    <text x="75" y="434" text-anchor="end">0</text><text x="75" y="344" text-anchor="end">5</text><text x="75" y="254" text-anchor="end">10</text><text x="75" y="164" text-anchor="end">15</text><text x="75" y="84" text-anchor="end">20</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="90" y1="340" x2="830" y2="340"/><line x1="90" y1="250" x2="830" y2="250"/><line x1="90" y1="160" x2="830" y2="160"/><line x1="90" y1="70" x2="830" y2="70"/></g>
  <g font-family="Segoe UI, Arial" font-size="16" fill="#0f172a" text-anchor="middle">
    <text x="210" y="462">Agente único</text><text x="450" y="462">Gerador + Verificador</text><text x="690" y="462">Supervisor</text>
  </g>
  <g>
    <rect x="150" y="88" width="55" height="342" rx="4" fill="#2563eb"/><rect x="215" y="88" width="55" height="342" rx="4" fill="#f59e0b"/>
    <rect x="390" y="88" width="55" height="342" rx="4" fill="#2563eb"/><rect x="455" y="250" width="55" height="180" rx="4" fill="#f59e0b"/>
    <rect x="630" y="232" width="55" height="198" rx="4" fill="#2563eb"/><rect x="695" y="214" width="55" height="216" rx="4" fill="#f59e0b"/>
  </g>
  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="178" y="78">19</text><text x="243" y="240">10</text><text x="418" y="78">19</text><text x="483" y="240">10</text><text x="658" y="222">11</text><text x="723" y="204">12</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="14"><rect x="700" y="40" width="18" height="18" fill="#2563eb"/><text x="724" y="54" fill="#334155">LangGraph</text><rect x="700" y="65" width="18" height="18" fill="#f59e0b"/><text x="724" y="79" fill="#334155">CrewAI</text></g>
</svg>
